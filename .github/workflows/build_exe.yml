name: Gerar Executável e Release

# Espelha o workflow do Gerenciador de Ambientes.
#
# Desde 2026-09-02 o NebulaTIR tem vitrine própria
# (`vromarquestester/NebulaTIR-Releases`) e canal de atualização próprio. Antes
# disso a distribuição saía só pelo pacote da ToolBox — o pacote passa a ser
# apenas a porta de entrada, baixado uma vez, e daí em diante cada ferramenta
# se atualiza sozinha pelo `latest.json` da sua vitrine.
#
# Continua sem `gerar_docx.py`: o NebulaTIR ainda não tem docs/USER_GUIDE.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar o código
      # fetch-depth: 0 porque o passo final commita o changelog zerado na main,
      # e push a partir de clone raso é recusado com "shallow update not allowed".
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache de dependências pip
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: pip-${{ runner.os }}-

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Valida que a tag pushada (vX.Y.Z) bate com src/_version.py.
    # Evita publicar release com EXE marcado com versão diferente da tag.
    - name: Validar versão (tag vs. src/_version.py)
      id: validate_version
      run: |
        $tag = "${{ github.ref_name }}".TrimStart('v','V')
        $line = Select-String -Path src/_version.py -Pattern '__version__\s*=\s*"([^"]+)"'
        if (-not $line) { Write-Error "__version__ não encontrado em src/_version.py"; exit 1 }
        $appVer = $line.Matches[0].Groups[1].Value
        Write-Host "Tag    : $tag"
        Write-Host "App    : $appVer"
        if ($tag -ne $appVer) {
          Write-Error "Versão divergente: tag=$tag, src/_version.py=$appVer. Rode scripts/bump_version.py e re-tagueie."
          exit 1
        }
        echo "APP_VERSION=$appVer" >> $env:GITHUB_OUTPUT

    # Formato errado no changelog para o pipeline ANTES do build, em segundos,
    # em vez de depois de gastar minutos no PyInstaller.
    - name: Validar changelog pendente
      run: python scripts/changelog.py --validar

    # Regenera version_info.txt a partir do __version__ (single source of truth).
    # O .spec faz o mesmo no início do build; aqui é para falhar cedo se o
    # gerador quebrar, antes de gastar minutos no PyInstaller.
    - name: Regenerar version_info.txt
      run: python scripts/generate_version_info.py

    - name: Compilar com PyInstaller
      run: pyinstaller NebulaTIR.spec --noconfirm

    - name: Verificar artefato
      run: |
        if (!(Test-Path "dist\NebulaTIR.exe")) {
          Write-Error "Artefato não encontrado: dist\NebulaTIR.exe"
          exit 1
        }
        $size = (Get-Item "dist\NebulaTIR.exe").Length / 1MB
        Write-Host "Artefato gerado: NebulaTIR.exe ($([math]::Round($size, 1)) MB)"

    - name: Extrair versão da tag
      id: version
      run: |
        $version = "${{ github.ref_name }}"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Criar ZIP do executável
      run: |
        $zipName = "NebulaTIR_${{ steps.version.outputs.VERSION }}.zip"
        $staging = "dist\staging"
        New-Item -ItemType Directory -Path $staging -Force | Out-Null
        Copy-Item "dist\NebulaTIR.exe" $staging
        Compress-Archive -Path "$staging\*" -DestinationPath "dist\$zipName"
        Remove-Item $staging -Recurse -Force
        $size = (Get-Item "dist\$zipName").Length / 1MB
        Write-Host "ZIP criado: $zipName ($([math]::Round($size, 1)) MB)"
        Write-Host "Conteudo:"
        Expand-Archive "dist\$zipName" -DestinationPath "dist\inspect" -Force
        Get-ChildItem "dist\inspect" | ForEach-Object { Write-Host "  - $($_.Name) ($([math]::Round($_.Length/1KB, 1)) KB)" }
        Remove-Item "dist\inspect" -Recurse -Force

    # O mesmo ZIP já vai para a release logo abaixo; este artefato serve só
    # para inspecionar a build quando algo dá errado. Diferente das releases,
    # artefato do Actions CONSOME cota de storage da conta — daí a retenção
    # curta em vez do padrão de 90 dias.
    - name: Upload de artefato
      uses: actions/upload-artifact@v4
      with:
        name: NebulaTIR
        path: dist/NebulaTIR_*.zip
        retention-days: 1

    - name: Montar corpo da release
      run: |
        # `-join`: sem ele o PowerShell entrega a saída como array e "$mudou"
        # junta as linhas com espaço — a v0.4.0 saiu com cinco mudanças numa linha.
        $mudou = (python scripts/changelog.py --corpo-release) -join "`n"
        $corpo = "Nova versão do NebulaTIR.`n`n📦 Baixe o ``.zip`` na seção **Assets** abaixo."
        if ($mudou) { $corpo = "$corpo`n`n## O que mudou`n`n$mudou" }
        $corpo | Out-File -FilePath "dist\corpo_release.md" -Encoding utf8
        Write-Host $corpo

    # A release é criada pela action (tag, notas); o ZIP vai num passo à parte,
    # com insistência. Em 2026-09-17 o upload de assets do GitHub respondeu
    # HTTP 500 intermitente ("Error saving asset", "Error creating asset temp
    # dir") em cinco tentativas seguidas da CI — e passava na segunda
    # insistência feita à mão. Nem a action nem o `gh` repetem em 5xx.
    - name: Criar Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: dist/corpo_release.md

    - name: Anexar o ZIP à release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $zip = (Get-ChildItem "dist\NebulaTIR_*.zip")[0].FullName
        .\scripts\anexar_release.ps1 -Repo "${{ github.repository }}" -Tag "${{ steps.version.outputs.VERSION }}" -Arquivo $zip

    # ─────────────────────────────────────────────────────────────
    # Distribuição pública: replica a release na vitrine, permitindo download
    # sem autenticação no GitHub.
    #
    # Requer o secret RELEASE_REPO_TOKEN (fine-grained PAT com Contents: Read
    # and write APENAS na vitrine). Quem publica não lê fonte.
    #
    # A vitrine não tem workflow nem secret — ela é depósito. Release que chega
    # lá não dispara nada; quem avisa é quem publica, e por isso o card do Chat
    # sai daqui.
    # ─────────────────────────────────────────────────────────────
    - name: Publicar release na vitrine
      uses: softprops/action-gh-release@v2
      with:
        repository: vromarquestester/NebulaTIR-Releases
        token: ${{ secrets.RELEASE_REPO_TOKEN }}
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Versão ${{ steps.version.outputs.VERSION }}
        body_path: dist/corpo_release.md

    - name: Anexar o ZIP à release da vitrine
      env:
        GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      run: |
        $zip = (Get-ChildItem "dist\NebulaTIR_*.zip")[0].FullName
        .\scripts\anexar_release.ps1 -Repo "vromarquestester/NebulaTIR-Releases" -Tag "${{ steps.version.outputs.VERSION }}" -Arquivo $zip

    # O canal que o programa instalado consulta, em
    # raw.githubusercontent.com/<vitrine>/main/latest.json.
    #
    # Vem DEPOIS da release pública: aponta para o anexo dela, e publicá-lo
    # antes deixaria a URL apontando para um arquivo que ainda não existe.
    #
    # Um arquivo em vez da API de releases porque `raw` não tem o teto de 60
    # requisições/hora por IP — a equipe inteira atrás de um NAT corporativo
    # estoura esse limite.
    - name: Gerar latest.json
      run: |
        $zip = (Get-ChildItem "dist\NebulaTIR_*.zip")[0].FullName
        python scripts/gerar_latest_json.py --tag "${{ steps.version.outputs.VERSION }}" --zip "$zip" --saida "dist\latest.json"
        Get-Content "dist\latest.json"

    - name: Publicar latest.json na vitrine
      env:
        RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      run: python scripts/publicar_latest_json.py --arquivo "dist\latest.json" --tag "${{ steps.version.outputs.VERSION }}"

    # ─────────────────────────────────────────────────────────────
    # Mantém apenas o .zip da versão recém-publicada.
    #
    # Cada release guardava seu próprio pacote, e a lista só crescia. Aqui os
    # ANEXOS das releases anteriores são apagados; a release, as notas e a tag
    # continuam — quem precisar do binário de uma versão antiga reconstrói a
    # partir da tag.
    #
    # Não derruba o pipeline se falhar: a release já saiu, e limpeza é
    # acessório.
    # ─────────────────────────────────────────────────────────────
    - name: Limpar anexos das releases anteriores
      if: success()
      continue-on-error: true
      env:
        TOKEN_PRIVADO: ${{ secrets.GITHUB_TOKEN }}
        TOKEN_PUBLICO: ${{ secrets.RELEASE_REPO_TOKEN }}
        VERSAO_ATUAL: ${{ steps.version.outputs.VERSION }}
      run: |
        function Limpar-Anexos($repo, $token, $manter) {
          if (-not $token) {
            Write-Host "[$repo] sem token — ignorado."
            return
          }
          $env:GH_TOKEN = $token
          Write-Host "[$repo] mantendo apenas os anexos de $manter"
          # --jq filtra por página: evita concatenar JSON de várias páginas.
          $ids = gh api "repos/$repo/releases" --paginate `
                   --jq ".[] | select(.tag_name != `"$manter`") | .assets[].id"
          if (-not $ids) {
            Write-Host "[$repo] nada a remover."
            return
          }
          foreach ($id in $ids) {
            if (-not $id) { continue }
            gh api -X DELETE "repos/$repo/releases/assets/$id" | Out-Null
            Write-Host "[$repo] anexo $id removido."
          }
        }

        Limpar-Anexos "${{ github.repository }}" $env:TOKEN_PRIVADO $env:VERSAO_ATUAL
        Limpar-Anexos "vromarquestester/NebulaTIR-Releases" $env:TOKEN_PUBLICO $env:VERSAO_ATUAL

    # Nunca derruba o pipeline: a release já saiu quando isto roda.
    - name: Notificar Google Chat
      if: success()
      continue-on-error: true
      env:
        GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
      run: python scripts/notificar_chat.py --tag "${{ steps.version.outputs.VERSION }}"

    # O acumulador volta ao esqueleto. Sem isto a versão seguinte anunciaria de
    # novo o que esta já anunciou. O histórico não se perde: o mesmo texto foi
    # para o corpo da release, que é permanente.
    #
    # `[skip ci]` evita que este commit dispare o workflow de testes.
    - name: Zerar changelog pendente
      if: success()
      continue-on-error: true
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git checkout -B main origin/main
        python scripts/changelog.py --zerar
        $mudou = git status --porcelain changelog_pendente.txt
        if (-not $mudou) {
          Write-Host "changelog_pendente.txt já estava vazio — nada a commitar."
          exit 0
        }
        git add changelog_pendente.txt
        git commit -m "chore: zera o changelog pendente apos ${{ steps.version.outputs.VERSION }} [skip ci]"
        git push origin main
